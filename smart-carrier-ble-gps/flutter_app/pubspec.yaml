name: smart_carrier_app
description: BLE and GPS based smart carrier safety application
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 1.35.7
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  geolocator: ^13.0.4
  google_maps_flutter: ^2.10.0
  shared_preferences: ^2.5.0
  provider: ^6.1.2
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
